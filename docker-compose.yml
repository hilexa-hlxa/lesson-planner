version: '3.8'

services:
  # Наш бэкенд на PHP
  backend:
    build: ./backend
    ports:
      - "8000:80" # Соединяем порт 8000 твоего ноута с 80-м портом контейнера
    environment:
      # Значения берутся из .env рядом с этим файлом (см. .env.example).
      # В репозиторий .env не попадает — секретам там не место.
      - DB_DSN=${DB_DSN}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - ./backend:/var/www/html # Синхронизация: меняешь код на ноуте — он меняется в докере

  # Твой фронтенд на React
  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    # Команда для запуска фронта
    command: sh -c "npm install && npm run dev -- --host"