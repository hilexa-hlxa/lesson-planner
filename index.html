<!doctype html>

    <!-- Тема/контраст раньше выставлялись только в useEffect в App.jsx —
         то есть ПОСЛЕ первого пейнта. Возвращающийся пользователь с тёмной
         темой на каждой загрузке на долю секунды видел светлый экран,
         который тут же перекрашивался в тёмный. Синхронный инлайн-скрипт
         в <head> выполняется до пейнта, так что класс уже на месте, когда
         браузер впервые рисует страницу — тот же паттерн, что использует
         next-themes и рекомендует сам Tailwind. Логика продублирована из
         эффекта в App.jsx (localStorage-ключи те же); дублирование тут
         неизбежно — этот скрипт обязан отработать до того, как загрузится
         React, так что импортировать общий модуль он не может. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          if (localStorage.getItem('theme') === 'dark') root.classList.add('dark');
          if (localStorage.getItem('highContrast') === 'true') root.classList.add('high-contrast');
        } catch (e) {}
      })();
    </script>
