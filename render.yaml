services:
  # ── Admin dashboard (Node/Express) ─────────────────────────────────────────
  # Separate service, separate URL, separate login — NOT part of the public
  # site and not linked from it. Reads the same Supabase database as
  # lessonlab-backend (read-mostly; the one write path is a user active/
  # inactive toggle). See admin/README.md for the full env var list and what
  # each page shows.
  - type: web
    name: lessonlab-admin
    runtime: node
    buildCommand: cd admin && npm install
    startCommand: cd admin && npm start
    plan: free
    buildFilter:
      paths:
        - admin/**
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # set manually in Render dashboard — long random value
      - key: SESSION_SECRET
        sync: false          # set manually in Render dashboard — long random value
      - key: PGHOST
        sync: false          # host portion of lessonlab-backend's DB_DSN
      - key: PGPORT
        sync: false          # port portion of lessonlab-backend's DB_DSN (usually 5432)
      - key: PGDATABASE
        sync: false          # dbname portion of lessonlab-backend's DB_DSN
      - key: PGUSER
        sync: false          # same value as lessonlab-backend's DB_USER
      - key: PGPASSWORD
        sync: false          # same value as lessonlab-backend's DB_PASS

  # ── Backend (PHP 8.2 + Apache via Docker) ─────────────────────────────────
  - type: web
    name: lessonlab-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Without this, every commit — including a frontend-only change or a
    # docs-only ROADMAP.md edit — rebuilt AND restarted this Docker service,
    # even though nothing under backend/ changed. A restart drops in-flight
    # requests on the free plan (single instance, no rolling deploy), so an
    # unrelated commit could interrupt a teacher mid-generation for no
    # reason. Scope rebuilds to what can actually affect this service.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_DSN
        sync: false          # set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false          # sole generation provider — see GenerateStream::handle()
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGIN
        sync: false          # set to the frontend Render URL after first deploy
      - key: COOKIE_SAMESITE
        value: None          # required for cross-origin cookie (frontend ≠ backend domain)
      - key: COOKIE_SECURE
        value: "true"        # Render always serves over HTTPS

  # ── Frontend (React + Vite → static site) ─────────────────────────────────
  - type: web
    name: lessonlab-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Mirrors the backend service's buildFilter: a pure backend/** commit
    # (like a PHP-only bugfix) has no effect on this build's output, so
    # don't spend a full npm install + vite build re-publishing an
    # unchanged dist/ for it. Anything that isn't clearly backend-only or
    # docs-only still triggers a rebuild here, which is the safe default.
    buildFilter:
      ignoredPaths:
        - backend/**
        - admin/**
        - docs/**
        - '*.md'
        - docker-compose.yml
        - .env.example
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to the backend Render URL after first deploy
    routes:
      # Explicit rewrites for the prerendered public routes (see
      # scripts/prerender-meta.mjs and src/lib/seoMeta.js#PRERENDER_ROUTES —
      # keep this list in sync with that array) MUST come before the SPA
      # catch-all below. Render matches routes top-to-bottom, first match
      # wins; without these, a bare "/pricing" (no trailing slash — the URL
      # form anyone actually shares) falls through to the catch-all and
      # serves dist/index.html's generic meta instead of dist/pricing's,
      # defeating the whole point of prerendering. Confirmed locally: `vite
      # preview` resolves "/pricing/" and "/pricing/index.html" to the right
      # file automatically, but NOT bare "/pricing" — same directory-index
      # ambiguity is expected here, so we don't rely on it.
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /join-test
        destination: /join-test/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite        # SPA fallback — everything else serves index.html
        source: /*
        destination: /index.html
    headers:
      # Vite hashes every asset filename (index-TcOhTsfl.js) — a new build
      # always gets a new URL, so the old one never needs revalidating.
      # Without this Render sent max-age=0, forcing a round-trip to check
      # "did this change?" on every single page load for files that by
      # construction never change under the same URL.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Security headers — there were none beyond what Render/Cloudflare add
      # automatically (HSTS, X-Content-Type-Options). Applied to every path.
      #
      # CSP notes, since this is the header most likely to silently break
      # something if changed carelessly:
      # - script-src allows exactly one inline script by SHA-256 hash rather
      #   than 'unsafe-inline' — the dark-mode/high-contrast FOUC-prevention
      #   script in index.html's <head> (see that file's comment). Precise
      #   allowance, not a blanket one; any OTHER injected inline script
      #   still gets blocked. If that script's exact text ever changes,
      #   recompute the hash (python3 -c "import hashlib,base64;
      #   print(base64.b64encode(hashlib.sha256(open('index.html').read()
      #   .split('<script>')[1].split('</script>')[0].encode()).digest())
      #   .decode())") and update the value below, or the FOUC fix silently
      #   stops running (fails closed — no error, dark mode just flashes
      #   again).
      # - style-src needs 'unsafe-inline': several components (FortuneWheel,
      #   SeatingChartPage's grid, DailyChallengePage's progress bar) use
      #   React's style={{}} prop with per-render-computed values, which
      #   can't be hash-allowed. Standard, broadly-accepted tradeoff — CSS
      #   injection risk is much lower than script injection, which is why
      #   script-src above gets the precise treatment and this doesn't.
      # - connect-src names the backend origin explicitly — every fetch in
      #   src/api.js goes to VITE_API_BASE_URL (lessonlab-backend.onrender.com
      #   in this deploy). Update this if the backend ever moves origins.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'sha256-VX8LmaaG7MUWhqcli9SZJOUu8Okk6HPlfQS7x6bHl2s=';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://lessonlab-backend.onrender.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
