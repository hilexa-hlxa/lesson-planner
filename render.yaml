services:
  # ── Backend (PHP 8.2 + Apache via Docker) ─────────────────────────────────
  - type: web
    name: lessonlab-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_DSN
        sync: false          # set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GROQ_API_KEY
        sync: false          # preferred provider — set this and generation uses Groq, not Gemini
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGIN
        sync: false          # set to the frontend Render URL after first deploy
      - key: COOKIE_SAMESITE
        value: None          # required for cross-origin cookie (frontend ≠ backend domain)
      - key: COOKIE_SECURE
        value: "true"        # Render always serves over HTTPS

  # ── Frontend (React + Vite → static site) ─────────────────────────────────
  - type: web
    name: lessonlab-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to the backend Render URL after first deploy
    routes:
      # Explicit rewrites for the prerendered public routes (see
      # scripts/prerender-meta.mjs and src/lib/seoMeta.js#PRERENDER_ROUTES —
      # keep this list in sync with that array) MUST come before the SPA
      # catch-all below. Render matches routes top-to-bottom, first match
      # wins; without these, a bare "/pricing" (no trailing slash — the URL
      # form anyone actually shares) falls through to the catch-all and
      # serves dist/index.html's generic meta instead of dist/pricing's,
      # defeating the whole point of prerendering. Confirmed locally: `vite
      # preview` resolves "/pricing/" and "/pricing/index.html" to the right
      # file automatically, but NOT bare "/pricing" — same directory-index
      # ambiguity is expected here, so we don't rely on it.
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /join-test
        destination: /join-test/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite        # SPA fallback — everything else serves index.html
        source: /*
        destination: /index.html
    headers:
      # Vite hashes every asset filename (index-TcOhTsfl.js) — a new build
      # always gets a new URL, so the old one never needs revalidating.
      # Without this Render sent max-age=0, forcing a round-trip to check
      # "did this change?" on every single page load for files that by
      # construction never change under the same URL.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
